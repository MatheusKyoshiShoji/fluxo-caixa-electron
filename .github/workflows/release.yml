name: Release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite) and package
        run: npm run make
        env:
          CI: true

      - name: Publish with electron-forge
        run: npx electron-forge publish --platform=all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}